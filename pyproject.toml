[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshmind"
version = "0.0.1"
description = "Mesh-native artificial intelligence research"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "tokenizers>=0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["meshmind*"]
exclude = ["data*", "docs*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
